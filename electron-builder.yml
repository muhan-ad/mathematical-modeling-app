appId: com.example.mathematicalmodelingapp
productName: MathematicalModelingApp
directories:
  output: release
files:
  - out/**/*
# Agent 运行时与内置环境随安装包分发（自包含，目标机器无需装 Python）
extraResources:
  # Agent Runtime 源码（仅顶层 .py，排除 .venv 与 __pycache__）
  - from: agent
    to: agent
    filter:
      - "*.py"
  # 内置便携 Python（含全部依赖，scripts/setup-python.ps1 装配）
  - from: vendor/python
    to: vendor/python
  # 随包内置技能（首次运行由 skill-service 播种到用户技能库）
  - from: resources/skills
    to: skills
  # 论文模板 class（cumcmthesis.cls），新建项目时复制到 paper/ 供 xelatex 编译
  - from: resources/paper-templates
    to: paper-templates
win:
  target:
    - nsis
    - zip
  artifactName: ${productName}-${version}.${ext}
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
